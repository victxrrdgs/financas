<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanças">
  <title>Minhas Finanças</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-art" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  </div>

  <!-- Login -->
  <section id="login" class="hidden">
    <div class="login-card g">
      <div class="logo">R$</div>
      <h1>Minhas Finanças</h1>
      <p>Contas, cartões, orçamentos e metas.<br>Sincronizado entre seus aparelhos.</p>
      <button id="btn-login" class="btn primary big">Entrar com Google</button>
      <p id="login-erro" class="erro"></p>
    </div>
  </section>

  <!-- App -->
  <section id="app" class="hidden">
    <header class="top">
      <button id="avatar" class="avatar" data-a="ir" data-id="conta" aria-label="Minha conta"></button>
      <div class="mes-pill g">
        <button id="mes-ant" aria-label="Mês anterior">‹</button>
        <span id="mes-label" data-a="hoje" title="Ir para o mês atual"></span>
        <button id="mes-prox" aria-label="Próximo mês">›</button>
      </div>
      <button id="btn-olho" class="ico g" aria-label="Ocultar valores"></button>
    </header>

    <main id="conteudo"></main>

    <nav class="dock g">
      <button data-tela="inicio" class="active">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span>
      </button>
      <button data-tela="lanc">
        <svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></svg><span>Contas</span>
      </button>
      <button id="fab" class="fab" data-a="novo" aria-label="Adicionar">+</button>
      <button data-tela="planejar">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg><span>Planejar</span>
      </button>
      <button data-tela="relatorios">
        <svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg><span>Relatórios</span>
      </button>
    </nav>
  </section>

  <!-- Bloqueio do app -->
  <section id="lock" class="hidden">
    <div class="lock-box">
      <div class="logo">R$</div>
      <h2>Minhas Finanças</h2>
      <p id="lock-msg">Digite seu PIN</p>
      <div class="pin-dots" id="pin-dots"></div>
      <div class="pinpad">
        <button data-pin="1">1</button><button data-pin="2">2</button><button data-pin="3">3</button>
        <button data-pin="4">4</button><button data-pin="5">5</button><button data-pin="6">6</button>
        <button data-pin="7">7</button><button data-pin="8">8</button><button data-pin="9">9</button>
        <button data-pin="bio" id="pin-bio" aria-label="Usar biometria">
          <svg viewBox="0 0 24 24"><path d="M12 11v3m-4-3a4 4 0 0 1 8 0v2a8 8 0 0 1-1 4M6 12a6 6 0 0 1 12-1M4.5 15A9 9 0 0 1 4 12a8 8 0 0 1 14-5.3M9 21a10 10 0 0 0 1-5v-3a2 2 0 0 1 4 0"/></svg>
        </button>
        <button data-pin="0">0</button>
        <button data-pin="del" aria-label="Apagar">⌫</button>
      </div>
      <button id="lock-sair" class="link">Esqueci o PIN · sair da conta</button>
    </div>
  </section>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="sheet g">
      <div class="grabber"></div>
      <div class="sheet-head">
        <h2 id="modal-titulo"></h2>
        <button class="ico g" id="modal-fechar" aria-label="Fechar">✕</button>
      </div>
      <div id="modal-corpo"></div>
    </div>
  </div>

  <div id="toast" class="toast g hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
